
name: Build TIC-80 PRO Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: nesbox/TIC-80
          ref: v1.4.1
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DBUILD_PRO=ON `
            -DBUILD_SDLGPU=ON `
            -DBUILD_WITH_ALL=ON

      - name: Compile TIC-80 PRO
        run: cmake --build build --config Release --parallel 2

      - name: Upload TIC-80 PRO

      
